# Public tests and a smoke test of the page in Chrome on every push. Weekly: does PokeMiners'
# game data still parse, and is there a newer tesseract.js? Both only report (a failed run sends
# GitHub's usual email); nothing is updated or published. Actions are pinned by commit;
# Dependabot (.github/dependabot.yml) proposes new ones.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Vendored files match SHA256SUMS
        run: bash tools/vendor.sh --check
      # npm test with a coverage report of src/. It fails when coverage falls below these
      # thresholds, set 1-2 points under the numbers measured on lts/* when they were raised:
      # coverage shifts a little between Node versions. Raise them when tests are added.
      # src/ui/app.js runs only in a page, so no test loads it and it is not in the report.
      - name: Tests (synthetic data), with coverage
        run: >-
          node --test --experimental-test-coverage --test-coverage-include='src/**'
          --test-coverage-lines=97 --test-coverage-branches=95 --test-coverage-functions=94

  # The page in a real browser (tests/browser/smoke.js): fails on CSP violations, console
  # errors and requests anywhere but the site and PokeMiners. playwright-core drives the
  # runner's own Chrome; it downloads no browser and isn't saved to package.json. Its version
  # is pinned here and updated by hand (Dependabot doesn't see it).
  smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: playwright-core, pinned, not saved, without install scripts
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.64.0
      - name: Smoke test in Chrome
        run: node --test tests/browser/smoke.js

  upstream-format:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build gm.json from the current game master and text tables (not kept)
        run: bash tools/build-gm.sh -l en,de -o "$RUNNER_TEMP/gm.json"

  vendor-outdated:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Newer tesseract.js? (update by hand with tools/vendor.sh --update, then test)
        run: bash tools/vendor.sh --outdated
