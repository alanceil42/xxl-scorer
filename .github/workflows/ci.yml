# Public tests on every push. Weekly: does PokeMiners' game data still parse, and is there a
# newer tesseract.js? Both only report (a failed run sends GitHub's usual email); nothing is
# updated or published.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Vendored files match SHA256SUMS
        run: bash tools/vendor.sh --check
      # npm test with a coverage report of src/. It fails when coverage falls below these
      # thresholds, set 1-2 points under the numbers measured on lts/* when they were raised:
      # coverage shifts a little between Node versions. Raise them when tests are added.
      # src/ui/app.js runs only in a page, so no test loads it and it is not in the report.
      - name: Tests (synthetic data), with coverage
        run: >-
          node --test --experimental-test-coverage --test-coverage-include='src/**'
          --test-coverage-lines=97 --test-coverage-branches=95 --test-coverage-functions=94

  upstream-format:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build gm.json from the current game master and text tables (not kept)
        run: bash tools/build-gm.sh -l en,de -o "$RUNNER_TEMP/gm.json"

  vendor-outdated:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Newer tesseract.js? (update by hand with tools/vendor.sh --update, then test)
        run: bash tools/vendor.sh --outdated
