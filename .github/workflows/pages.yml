# Publishes the site to GitHub Pages for every published release.
# Only the files a browser loads go up. The site's own settings come from the repository
# variable SITE_CONFIG (the JSON of local/config.json, e.g. the imprint link); without it
# the shipped defaults apply. Run it by hand (Actions → Pages → Run workflow) to publish a given
# tag again, e.g. after changing SITE_CONFIG.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v1.0 (empty: the branch picked above)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Assemble the site
        env:
          SITE_CONFIG: ${{ vars.SITE_CONFIG }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -R index.html app.css icon.svg config.json src vendor "$site/"
          if [ -n "$SITE_CONFIG" ]; then
            mkdir -p "$site/local"
            printf '%s' "$SITE_CONFIG" | jq . > "$site/local/config.json"
            echo "local/config.json from SITE_CONFIG: $(jq -c 'keys' "$site/local/config.json")"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
