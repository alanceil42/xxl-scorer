# Keeps the actions used by CI and the Pages workflow current. They are pinned by commit
# (a tag can be moved to other code, a commit can't); Dependabot updates the commit and the
# version in the comment after it together. A new version is proposed only once it is a week
# old, which gives a bad release time to be noticed and pulled: the Pages workflow's actions can
# publish the site. The page itself has no dependencies to update: tesseract.js is vendored on
# purpose and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
