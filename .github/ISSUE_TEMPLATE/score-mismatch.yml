name: Score differs from the game
description: The score shown in a showcase is outside xxl-scorer's ± range
labels: [formula]
body:
  - type: markdown
    attributes:
      value: |
        These reports are how we notice when the game changes its scoring.
        The game shows a whole number; xxl-scorer flags a difference larger than its ± range + 0.5.
  - type: input
    id: version
    attributes:
      label: xxl-scorer version
      description: In the page's footer ("version 1.0"), or the commit if you run main.
      placeholder: "1.0"
    validations:
      required: false
  - type: input
    id: pokemon
    attributes:
      label: Pokémon and form
      placeholder: "Tornadus (Incarnate)"
    validations:
      required: true
  - type: input
    id: values
    attributes:
      label: Height, weight, IVs (Atk/Def/HP)
      placeholder: "2.30 m, 109.32 kg, 15/13/15"
    validations:
      required: true
  - type: input
    id: scores
    attributes:
      label: Score in the game / score in xxl-scorer
      placeholder: "1143 / 1144.1 ± 1.7"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of the showcase
    validations:
      required: true
