# Example: serve xxl-scorer under /xxl/.
# Put these locations into an existing server { } block, or include this file there.
#
# Everything lives in one directory, here /opt/xxl-scorer:
#   the release (static files, nothing executes), replaced on update
#   local/config.json      your settings, e.g. {"gm": "local/data/gm.json"}
#   local/data/gm.json     written by contrib/systemd/xxl-scorer-gm.{service,timer}
#
# config.json and gm.json need no cache headers: the page fetches them with cache: 'no-cache',
# which nginx answers with 304 via its ETag when they haven't changed.
#
# Gzip JavaScript and JSON: the text recognition engine is 3.9 MB raw, 1.5 MB gzipped.
#   gzip on; gzip_types application/javascript text/javascript application/json;

# Repo internals are not part of the site: dot files and folders (.git, .github), tests,
# tools, contrib, node_modules
location ~ ^/xxl/(\.[^/]*|tests|tools|contrib|node_modules)(/|$) {
	return 404;
}

location /xxl/ {
	alias /opt/xxl-scorer/;
	index index.html;
	# Security headers. The page brings its own Content-Security-Policy
	# as a <meta> tag; this header adds what a meta tag can't: no framing by other sites. Both
	# apply. Note: add_header here replaces every add_header of the server block, so repeat
	# any of yours (HSTS, say) in this location.
	add_header Content-Security-Policy "frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
	# The files keep their names from version to version (no build step). Without this, a
	# browser may keep app.css or a module for hours by its own guess and mix it with a newer
	# index.html after an update. no-cache = ask every time; unchanged files cost a 304.
	add_header Cache-Control "no-cache" always;
}
# Best on a host name of its own (xxl.example.org): the README's Hosting section says why.
